<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="NeverBefore — stay curious, make something wonderful">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb49c"/><stop offset=".42" stop-color="#fda6d1"/><stop offset="1" stop-color="#b4a5ff"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2c4"/><stop offset="1" stop-color="#ff7eac"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".16"/></pattern>
    <style>
      .float{animation:float 7s ease-in-out infinite}.spark{animation:twinkle 4s ease-in-out infinite}.delay{animation-delay:-2s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.float,.spark{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="20" r="210" fill="#fff" opacity=".13"/>
  <circle cx="45" cy="365" r="145" fill="#fff" opacity=".13"/>
  <path d="M0 325Q160 280 325 324T660 330T1000 310T1200 325V380H0Z" fill="#fff" opacity=".24"/>
  <path d="M0 350Q190 320 390 350T780 344T1200 348V380H0Z" fill="#fff" opacity=".38"/>
  <g font-family="'Segoe UI',Arial,sans-serif" fill="#342249">
    <rect x="70" y="55" width="212" height="30" rx="15" fill="#fff" opacity=".6"/>
    <circle cx="88" cy="70" r="4" fill="#9658ba"/>
    <text x="101" y="75" font-size="11" font-weight="700" letter-spacing="2.2">A CURIOUS LITTLE CORNER</text>
    <text x="65" y="180" font-size="85" font-weight="800" letter-spacing="-4">NeverBefore<tspan fill="#fff">.</tspan></text>
    <text x="72" y="226" font-size="22" font-weight="500" letter-spacing=".4">Stay curious, make something wonderful.</text>
    <text x="73" y="275" font-size="12" font-weight="700" letter-spacing="3" opacity=".65">HELLO WORLD / WELCOME ABOARD</text>
  </g>
  <g class="float">
    <circle cx="975" cy="174" r="74" fill="url(#orb)"/>
    <ellipse cx="975" cy="180" rx="119" ry="27" transform="rotate(-24 975 180)" fill="none" stroke="#fff" stroke-width="9" opacity=".85"/>
    <circle cx="953" cy="151" r="13" fill="#fff" opacity=".25"/>
    <circle cx="993" cy="193" r="22" fill="#ff7eac" opacity=".18"/>
  </g>
  <g fill="#fff" class="spark"><path d="M827 85l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M1095 244l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
  <g fill="#fff" class="spark delay"><path d="M1088 70l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><circle cx="848" cy="264" r="4"/><circle cx="1130" cy="158" r="3"/><circle cx="750" cy="61" r="3"/></g>
</svg>
